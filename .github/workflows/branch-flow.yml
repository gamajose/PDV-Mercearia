name: Branch Flow

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "release/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh label create automerge \
            --color 1D76DB \
            --description "Merge automático após CI bem-sucedida" \
            --force

          number="$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"

          if [ -z "$number" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "${BRANCH#*/}" \
              --body "Pull request criada automaticamente. A integração ocorrerá somente após a CI concluir com sucesso." \
              --label automerge
          else
            gh pr edit "$number" --add-label automerge
          fi
