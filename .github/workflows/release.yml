name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION deve seguir o formato MAJOR.MINOR.PATCH."
          }

          $tag = "v$version"
          git fetch --tags --force
          $existing = git tag --list $tag
          $publish = [string]::IsNullOrWhiteSpace($existing)

          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "PDV_VERSION=$version" >> $env:GITHUB_ENV

      - name: Version already published
        if: steps.version.outputs.publish != 'true'
        shell: pwsh
        run: Write-Host "A versão ${{ steps.version.outputs.tag }} já está publicada."

      - name: Restore, build and test
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          dotnet restore Pdv.sln
          dotnet build Pdv.sln --configuration Release --no-restore
          dotnet test Pdv.sln --configuration Release --no-build

      - name: Publish applications
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          dotnet publish src/Pdv.StoreNode/Pdv.StoreNode.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/store-node -p:Version=${{ steps.version.outputs.value }}
          dotnet publish src/Pdv.Desktop/Pdv.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/desktop -p:Version=${{ steps.version.outputs.value }}

      - name: Build installers
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force installer/output | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/central.iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/terminal.iss

      - name: Create version tag and GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ steps.version.outputs.tag }}" installer/output/*.exe `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "PDV Gama ${{ steps.version.outputs.value }}" `
            --generate-notes
