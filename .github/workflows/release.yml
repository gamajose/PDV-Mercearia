name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION inválida" >&2; exit 1; }
          tag="v${version}"
          git fetch --tags --force
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then publish=false; else publish=true; fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    env:
      PDV_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore build and test
        shell: pwsh
        run: |
          dotnet restore Pdv.sln
          dotnet build Pdv.sln --configuration Release --no-restore
          dotnet test Pdv.sln --configuration Release --no-build
      - name: Publish desktop applications
        shell: pwsh
        run: |
          dotnet publish src/Pdv.StoreNode/Pdv.StoreNode.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/store-node -p:Version=${{ needs.version.outputs.value }}
          dotnet publish src/Pdv.Desktop/Pdv.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/desktop -p:Version=${{ needs.version.outputs.value }}
      - name: Build Windows installers
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force installer/output | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/central.iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/terminal.iss
      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: installer/output/*.exe
          if-no-files-found: error

  web-linux:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore web and tests
        shell: bash
        run: |
          dotnet restore src/Pdv.Web/Pdv.Web.csproj
          dotnet restore tests/Pdv.Domain.Tests/Pdv.Domain.Tests.csproj
      - name: Build and test
        shell: bash
        run: |
          dotnet build src/Pdv.Web/Pdv.Web.csproj --configuration Release --no-restore
          dotnet test tests/Pdv.Domain.Tests/Pdv.Domain.Tests.csproj --configuration Release --no-restore
      - name: Publish web service
        run: >
          dotnet publish src/Pdv.Web/Pdv.Web.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --no-restore
          --output artifacts/web
          -p:Version=${{ needs.version.outputs.value }}
      - name: Package Linux assets
        shell: bash
        run: |
          mkdir -p artifacts/web/tools dist
          cp deploy/linux/update-web.sh artifacts/web/tools/update-web.sh
          chmod +x artifacts/web/Pdv.Web artifacts/web/tools/update-web.sh deploy/linux/install-web.sh
          archive="PDV-Gama-Web-${{ needs.version.outputs.value }}-linux-x64.tar.gz"
          tar -C artifacts/web -czf "dist/${archive}" .
          sha256sum "dist/${archive}" | sed "s#dist/##" > "dist/${archive}.sha256"
          cp deploy/linux/install-web.sh dist/PDV-Gama-install-web.sh
      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: release-web-linux
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, windows, web-linux]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "PDV Gama ${{ needs.version.outputs.value }}" \
            --generate-notes
