name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/Pdv.Web/**"
      - "deploy/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/Pdv.Web/Pdv.Web.csproj
      - name: Build
        run: dotnet build src/Pdv.Web/Pdv.Web.csproj --configuration Release --no-restore
      - name: Publish Linux
        run: dotnet publish src/Pdv.Web/Pdv.Web.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/web -p:Version=$(cat VERSION)
      - name: Package
        run: tar -C artifacts/web -czf pdv-gama-web-$(cat VERSION)-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: pdv-gama-web-linux
          path: pdv-gama-web-*-linux-x64.tar.gz
