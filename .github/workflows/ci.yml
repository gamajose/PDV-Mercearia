name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop and installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          "value=$version" >> $env:GITHUB_OUTPUT
          "PDV_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore Pdv.sln

      - name: Build
        run: dotnet build Pdv.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Pdv.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publish Store Node
        run: >
          dotnet publish src/Pdv.StoreNode/Pdv.StoreNode.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/store-node
          -p:Version=${{ steps.version.outputs.value }}

      - name: Publish Desktop
        run: >
          dotnet publish src/Pdv.Desktop/Pdv.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/desktop
          -p:Version=${{ steps.version.outputs.value }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Central installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/output | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/central.iss

      - name: Build Terminal installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/terminal.iss

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: pdv-gama-${{ steps.version.outputs.value }}-windows
          path: installer/output/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 14

  web-linux:
    name: Web service Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Restore web and tests
        shell: bash
        run: |
          dotnet restore src/Pdv.Web/Pdv.Web.csproj
          dotnet restore tests/Pdv.Domain.Tests/Pdv.Domain.Tests.csproj

      - name: Build web service
        run: dotnet build src/Pdv.Web/Pdv.Web.csproj --configuration Release --no-restore

      - name: Test domain
        run: dotnet test tests/Pdv.Domain.Tests/Pdv.Domain.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Publish web service
        run: >
          dotnet publish src/Pdv.Web/Pdv.Web.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --no-restore
          --output artifacts/web
          -p:Version=${{ steps.version.outputs.value }}

      - name: Package web service
        shell: bash
        run: |
          mkdir -p artifacts/web/tools dist
          cp deploy/linux/update-web.sh artifacts/web/tools/update-web.sh
          chmod +x artifacts/web/Pdv.Web artifacts/web/tools/update-web.sh deploy/linux/install-web.sh
          archive="PDV-Gama-Web-${{ steps.version.outputs.value }}-linux-x64.tar.gz"
          tar -C artifacts/web -czf "dist/${archive}" .
          sha256sum "dist/${archive}" | sed "s#dist/##" > "dist/${archive}.sha256"
          cp deploy/linux/install-web.sh dist/PDV-Gama-install-web.sh

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: pdv-gama-${{ steps.version.outputs.value }}-web-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 14
