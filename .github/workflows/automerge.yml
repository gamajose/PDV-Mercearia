name: Auto Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Merge validated pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail

          pr="$(gh pr list \
            --repo "$REPOSITORY" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number,labels \
            --jq '[.[] | select(any(.labels[]; .name == "automerge"))][0].number // empty')"

          if [ -z "$pr" ]; then
            echo "Nenhuma PR autorizada para merge automático."
            exit 0
          fi

          gh pr merge "$pr" \
            --repo "$REPOSITORY" \
            --squash \
            --delete-branch \
            --subject "merge: $BRANCH"
